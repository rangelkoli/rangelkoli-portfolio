<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Footer C · Still Shipping</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --page: #F4F4F4;
    --field: #1E3FD8;
    --ink: #FFFFFF;
    --muted: rgb(255 255 255 / 0.72);
    --rule: rgb(255 255 255 / 0.22);
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--page); font-family: "Bricolage Grotesque", system-ui, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
  .lead { max-width: 72rem; margin: 0 auto; padding: 72px 24px 56px; color: #6B6B73; font-size: 15px; }
  footer { padding: 0 16px 16px; }
  .field { background: var(--field); color: var(--ink); border-radius: 32px; padding: 48px 24px 24px; }
  .inner { max-width: 72rem; margin: 0 auto; }
  .head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 24px; }
  h2 { font-size: clamp(44px, 8vw, 112px); line-height: .92; font-weight: 800; letter-spacing: -0.035em; font-variation-settings: "opsz" 96; }
  .head p { font-size: 17px; color: var(--muted); max-width: 30ch; line-height: 1.45; }
  .graph { margin-top: 40px; overflow: hidden; }
  .cells { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 1fr); gap: 3px; }
  .cells i { aspect-ratio: 1; border-radius: 2px; background: rgb(255 255 255 / 0.1); transform: scale(0); transition: transform .5s var(--ease), background-color .5s; }
  .field.in .cells i { transform: scale(1); }
  .cells i[data-l="1"] { background: rgb(255 255 255 / .3); }
  .cells i[data-l="2"] { background: rgb(255 255 255 / .55); }
  .cells i[data-l="3"] { background: rgb(255 255 255 / .8); }
  .cells i[data-l="4"] { background: #fff; }
  .cap { display: flex; justify-content: space-between; margin-top: 10px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .row { display: grid; grid-template-columns: 1fr; gap: 12px; margin-top: 40px; border-top: 1px solid var(--rule); padding-top: 24px; }
  @media (min-width: 900px) { .row { grid-template-columns: 2fr 1fr 1fr 1fr; align-items: center; } }
  .row a { color: var(--ink); text-decoration: none; font-size: 18px; font-weight: 500; min-height: 32px; display: inline-flex; align-items: center; gap: 8px; }
  .row a.big { font-size: clamp(22px, 2.4vw, 28px); font-weight: 700; }
  .row a:hover { text-decoration: underline; text-underline-offset: 5px; }
  :focus-visible { outline: 2px solid #fff; outline-offset: 4px; border-radius: 4px; }
  .base { max-width: 72rem; margin: 32px auto 0; display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
  @media (prefers-reduced-motion: reduce) { .cells i { transform: none; transition: none; } }
</style>
</head>
<body>
  <p class="lead">↑ end of Toolbox section</p>
  <footer id="contact">
    <div class="field">
      <div class="inner">
        <div class="head">
          <h2>Still<br>shipping.</h2>
          <p>Let's build something users actually enjoy using. Here's the last year, commit by commit.</p>
        </div>
        <div class="graph" aria-label="GitHub contributions over the last year">
          <div class="cells"></div>
          <div class="cap"><span id="total">— contributions in the last year</span><span>github.com/rangelkoli</span></div>
        </div>
        <div class="row">
          <a class="big" href="mailto:rangelkoli@gmail.com">rangelkoli@gmail.com →</a>
          <a href="https://github.com/rangelkoli">GitHub</a>
          <a href="https://linkedin.com/in/rangelkoli">LinkedIn</a>
          <a href="https://x.com/rangelkoli">X</a>
        </div>
        <div class="base"><span>Rangel Koli © 2026</span><span>New York, USA</span></div>
      </div>
    </div>
  </footer>
<script>
  const cells = document.querySelector('.cells'), field = document.querySelector('.field');
  const weeks = innerWidth < 600 ? 26 : 53;
  function draw(days) {
    days = days.slice(-weeks * 7);
    cells.innerHTML = '';
    days.forEach((d, i) => { const el = document.createElement('i'); el.dataset.l = d.level; el.style.transitionDelay = (Math.floor(i / 7) * 18 + (i % 7) * 10) + 'ms'; cells.append(el); });
    document.getElementById('total').textContent = days.reduce((s, d) => s + d.count, 0).toLocaleString('en-US') + ' contributions in the last ' + (weeks > 30 ? 'year' : '6 months');
  }
  fetch('https://github-contributions-api.jogruber.de/v4/rangelkoli?y=last')
    .then(r => r.json()).then(j => draw(j.contributions))
    .catch(() => draw(Array.from({ length: weeks * 7 }, () => ({ level: 0, count: 0 }))))
    .finally(() => new IntersectionObserver(([e]) => e.isIntersecting && field.classList.add('in'), { threshold: 0.3 }).observe(field));
</script>
</body>
</html>
